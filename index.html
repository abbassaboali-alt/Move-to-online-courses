    <script>
      /* Prudle host allowlist + save-shortcut deterrent. Server-side Worker checks are authoritative. */
      (function(){
        'use strict';
        const LOGIN_URL = "https://www.prudle-education.com/log-in-out";
        const ALLOWED_HOSTS = new Set([
          "www.prudle-education.com",
          "prudle-education.com",
          "abbassaboali-alt.github.io"
        ]);
        window.addEventListener("keydown", function(e){
          if((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === "s") {
            e.preventDefault();
          }
        }, { capture: true });
        const hostname = location.hostname.toLowerCase();
        const isDev = hostname === "localhost" || hostname === "127.0.0.1" || (location.port === "3000" && hostname.endsWith(".run.app"));
        if(!isDev && (location.protocol !== "https:" || !ALLOWED_HOSTS.has(hostname))){
          window.stop();
          try { document.documentElement.innerHTML = ""; } catch(e){}
          location.replace(LOGIN_URL);
          return;
        }
        if(hostname === "prudle-education.com"){
          window.stop();
          location.replace("https://www.prudle-education.com" + location.pathname + location.search + location.hash);
        }
      })();
    </script>
